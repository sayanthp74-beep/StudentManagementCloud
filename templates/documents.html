<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documents</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        nav {
            background: #1e3a8a;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            border: 1px solid white;
            padding: 8px 16px;
            border-radius: 6px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1e3a8a;
            margin-bottom: 25px;
        }

        .upload-box {
            padding: 20px;
            background: #f1f5f9;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        input[type="file"] {
            margin: 15px 0;
        }

        button {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #1e3a8a;
            color: white;
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            Student Documents
        </div>

        <a href="/dashboard" class="back">
            Dashboard
        </a>

    </nav>


    <div class="container">

        <div class="card">

            <h1>📁 Documents</h1>

            <div class="upload-box">

                <h3>Upload Document</h3>

                <form action="/upload" method="POST" enctype="multipart/form-data">

                    <input type="file" name="document" required>

                    <br>

                    <button type="submit">
                        Upload
                    </button>

                </form>

            </div>


            <h3>Uploaded Documents</h3>

            <br>

            <table>

                <tr>
                    <th>File Name</th>
                    <th>Upload Date</th>
                </tr>

                {% for document in documents %}

                <tr>
                    <td>{{ document[0] }}</td>
                    <td>{{ document[1] }}</td>
                </tr>

                {% endfor %}

            </table>

        </div>

    </div>

</body>

</html>
